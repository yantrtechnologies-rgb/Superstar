name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://cadencedesk:cadencedesk@127.0.0.1:5432/cadencedesk
      REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cadencedesk
          POSTGRES_PASSWORD: cadencedesk
          POSTGRES_DB: cadencedesk
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U cadencedesk" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:migrate
      - run: node --test apps/api/test/workspace-api.integration.mjs
      - run: node --test apps/mcp/test/clients.integration.mjs
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: node --test apps/worker/test/publishing.integration.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - run: docker compose config --quiet
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach
      - name: Check the stack
        run: |
          for url in http://localhost:3000/health http://localhost:3001/health/ready http://localhost:3002; do
            curl --fail --silent --show-error --retry 24 --retry-delay 5 --retry-all-errors "$url"
          done
      - name: Check the isolated media worker
        run: |
          for attempt in {1..20}; do
            if docker compose exec -T media-worker node -e "fetch('http://127.0.0.1:3003').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
