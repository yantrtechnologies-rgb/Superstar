x-application: &application
  image: cadencedesk-local
  build:
    context: .
    target: application
  environment: &application-env
    DATABASE_URL: postgresql://cadencedesk:cadencedesk@postgres:5432/cadencedesk
    REDIS_URL: redis://redis:6379
    APP_MODE: self-hosted
    API_REQUESTS_PER_MINUTE: ${API_REQUESTS_PER_MINUTE:-120}

x-object-storage-env: &object-storage-env
  OBJECT_STORAGE_ENDPOINT: http://storage:9000
  OBJECT_STORAGE_BUCKET: cadencedesk
  OBJECT_STORAGE_ACCESS_KEY: cadencedesk
  OBJECT_STORAGE_SECRET_KEY: cadencedesk-local

x-publishing-env: &publishing-env
  <<: [*application-env, *object-storage-env]
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
  DISCORD_WORKSPACE_CHANNELS: ${DISCORD_WORKSPACE_CHANNELS:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_WORKSPACE_CHATS: ${TELEGRAM_WORKSPACE_CHATS:-}
  SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
  SLACK_WORKSPACE_CHANNELS: ${SLACK_WORKSPACE_CHANNELS:-}
  APP_URL: ${APP_URL:-http://localhost:3000}
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-}
  OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
  OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-}
  AI_TRANSCRIBE_BASE_CREDITS: ${AI_TRANSCRIBE_BASE_CREDITS:-}
  MEDIA_CLIPPING_ENABLED: ${MEDIA_CLIPPING_ENABLED:-true}
  AI_TEXT_BASE_CREDITS: ${AI_TEXT_BASE_CREDITS:-}
  AI_IMAGE_BASE_CREDITS: ${AI_IMAGE_BASE_CREDITS:-}
  AI_CREDIT_MARKUP: ${AI_CREDIT_MARKUP:-2.0}
  AI_STARTER_CREDITS: ${AI_STARTER_CREDITS:-0}
  RSS_ALLOWED_FEEDS: ${RSS_ALLOWED_FEEDS:-}
  WEBHOOK_ALLOWED_ENDPOINTS: ${WEBHOOK_ALLOWED_ENDPOINTS:-}

services:
  postgres:
    networks: [default, media]
    image: postgres:16
    environment:
      POSTGRES_USER: cadencedesk
      POSTGRES_PASSWORD: cadencedesk
      POSTGRES_DB: cadencedesk
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cadencedesk", "-d", "cadencedesk"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
  temporal:
    networks: [default, media]
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: cadencedesk
      POSTGRES_PWD: cadencedesk
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "--namespace", "default", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  storage:
    networks: [default, media]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: cadencedesk
      MINIO_ROOT_PASSWORD: cadencedesk-local
    volumes:
      - objects:/data
    ports:
      - "127.0.0.1:9000:9000"
  migrate:
    <<: *application
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    <<: *application
    environment:
      <<: *publishing-env
      AUTH_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001}
    command: ["pnpm", "--filter", "@cadencedesk/web", "start"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
  api:
    <<: *application
    command: ["pnpm", "--filter", "@cadencedesk/api", "start"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3001:3001"
  worker:
    <<: *application
    environment:
      <<: *publishing-env
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
    command: ["pnpm", "--filter", "@cadencedesk/worker", "start"]
    depends_on:
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3002:3002"

  media-worker:
    image: cadencedesk-media-local
    build:
      context: .
      target: media
    command: ["pnpm", "--filter", "@cadencedesk/worker", "start:media"]
    environment:
      <<: *object-storage-env
      DATABASE_URL: postgresql://cadencedesk:cadencedesk@postgres:5432/cadencedesk
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
    depends_on:
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [media]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=128m,mode=1777"]
    pids_limit: 96
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 16
      start_period: 10s

networks:
  media:
    internal: true

volumes:
  database:
  objects:
