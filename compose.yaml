x-application: &application
  image: cadencedesk-local
  build: .
  environment:
    DATABASE_URL: postgresql://cadencedesk:cadencedesk@postgres:5432/cadencedesk
    REDIS_URL: redis://redis:6379
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_NAMESPACE: default
    OBJECT_STORAGE_ENDPOINT: http://storage:9000
    OBJECT_STORAGE_BUCKET: cadencedesk
    OBJECT_STORAGE_ACCESS_KEY: cadencedesk
    OBJECT_STORAGE_SECRET_KEY: cadencedesk-local
    APP_MODE: self-hosted
    APP_URL: http://localhost:3000

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cadencedesk
      POSTGRES_PASSWORD: cadencedesk
      POSTGRES_DB: cadencedesk
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cadencedesk", "-d", "cadencedesk"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: cadencedesk
      POSTGRES_PWD: cadencedesk
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "--namespace", "default", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: cadencedesk
      MINIO_ROOT_PASSWORD: cadencedesk-local
    volumes:
      - objects:/data
    ports:
      - "127.0.0.1:9000:9000"
  migrate:
    <<: *application
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    <<: *application
    command: ["pnpm", "--filter", "@cadencedesk/web", "start"]
    ports:
      - "127.0.0.1:3000:3000"
  api:
    <<: *application
    command: ["pnpm", "--filter", "@cadencedesk/api", "start"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3001:3001"
  worker:
    <<: *application
    command: ["pnpm", "--filter", "@cadencedesk/worker", "start"]
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3002"

volumes:
  database:
  objects:
